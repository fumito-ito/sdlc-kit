# managed-by: sdlc-kit {{kit_version}} — regenerated by `sdlc.py init`; change behavior in .sdlc/config.json instead.
name: sdlc-gate

on:
  pull_request:
  push:
    branches: [{{base_branch}}]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Artifacts lint, plan gate and secret scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="$BEFORE_SHA"
          fi
          python3 .sdlc/bin/sdlc.py check --base "$base"
